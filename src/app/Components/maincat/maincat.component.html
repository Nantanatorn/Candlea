<section class="bg-white py-12">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="mb-6 flex items-center justify-between">
      <h2 class="text-3xl md:text-4xl font-semibold text-gray-900">Categories</h2>

      <!-- ปุ่มเลื่อน -->
      <div class="hidden sm:flex items-center gap-3">
        <button (click)="scrollByCard(-1)" aria-label="Previous"
          class="h-10 w-10 grid place-items-center rounded-full border border-gray-300 bg-white hover:bg-gray-50">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <button (click)="scrollByCard(1)" aria-label="Next"
          class="h-10 w-10 grid place-items-center rounded-full border border-gray-300 bg-white hover:bg-gray-50">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 6l6 6-6 6"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- แถบเลื่อนแนวนอน -->
    <div #scrollEl
         class="scrollbar-none -mx-1 flex snap-x snap-mandatory overflow-x-auto px-1 gap-6">
      <ng-container *ngFor="let p of items">
        <!-- การ์ด -->
        <article data-card
          class="snap-start min-w-[260px] sm:min-w-[280px] max-w-[280px]">
          <div
            class="aspect-[3/4] w-full rounded-xl border border-gray-200 bg-gray-100 shadow-sm overflow-hidden">
            <!-- รูปสินค้า -->
            <img [src]="p.image"
                 alt="{{p.name}}"
                 class="h-full w-full object-cover"
                 >
          </div>
          <div class="mt-3">
            <h3 class="text-gray-900 font-medium truncate">{{ p.name }}</h3>
            <p class="text-gray-500">$ {{ p.price }}</p>
          </div>
        </article>
      </ng-container>
    </div>

    <!-- ปุ่มเลื่อน (แสดงบนจอเล็ก วางกลางล่าง) -->
    <div class="mt-6 flex sm:hidden justify-center gap-3">
      <button (click)="scrollByCard(-1)" aria-label="Previous"
        class="h-10 w-10 grid place-items-center rounded-full border border-gray-300 bg-white hover:bg-gray-50">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <button (click)="scrollByCard(1)" aria-label="Next"
        class="h-10 w-10 grid place-items-center rounded-full border border-gray-300 bg-white hover:bg-gray-50">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 6l6 6-6 6"/>
        </svg>
      </button>
    </div>
  </div>
</section>
