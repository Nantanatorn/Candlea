<section class="bg-[#f8ece8] py-16">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 text-center">
    <!-- หัวข้อ -->
    <h2 class="text-3xl md:text-4xl font-bold text-gray-900">Main Product</h2>
    <p class="mt-4 text-xl text-gray-700 font-medium max-w-2xl mx-auto">
      We craft elegant and sustainable candles that
      let your brand glow in every moment.
    </p>

    <!-- ปุ่ม -->
    <div class="mt-6">
      <a routerLink="/shop"
         class="inline-block bg-black text-white px-6 py-2.5 rounded hover:opacity-90 transition">
        View all products
      </a>
    </div>

    <!-- Grid สินค้า -->
    <div class="mt-12 grid gap-8 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
      <div *ngFor="let p of products"
           class="rounded-xl border border-gray-200 p-4 bg-white hover:shadow-lg transition">
        <div class="aspect-[3/4] w-full overflow-hidden rounded-lg bg-gray-100">
          <img [src]="p.image" alt="{{p.name}}"
               class="h-full w-full object-cover"
               >
        </div>
        <h3 class="mt-4 text-gray-900 font-medium truncate">{{ p.name }}</h3>
        <p class="text-gray-800 font-semibold">฿ {{ p.price }}</p>

        <!-- ปุ่ม cart -->
        <button
          class="mt-3 inline-flex items-center gap-2 rounded border border-gray-300 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
          <!-- ไอคอนตะกร้า -->
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 6h15l-1.5 9h-12z" />
            <path d="M6 6l-1-3H3" />
            <circle cx="9" cy="20" r="1.5" />
            <circle cx="18" cy="20" r="1.5" />
          </svg>
          Cart
        </button>
      </div>
    </div>
  </div>
</section>
