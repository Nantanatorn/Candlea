<nav
  class="sticky top-0 z-50 w-full bg-white/90 backdrop-blur border-b border-b-gray-300"
>
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">
      <!-- Left: Logo -->
      <a routerLink="/" class="flex items-center gap-3">
        <img
          src="assets/candle.png"
          alt="CANDLEA"
          class="h-17 w-auto rounded"
        />
        <span class="sr-only">CANDLEA</span>
      </a>

      <!-- Desktop nav -->
      <div class="hidden md:flex items-center gap-10">
        <a
          routerLink="/"
          routerLinkActive="font-semibold text-gray-900"
          [routerLinkActiveOptions]="{ exact: true }"
          class="text-gray-600 hover:text-gray-900 transition"
          >Home</a
        >
        <a
          routerLink="/about"
          routerLinkActive="font-semibold text-gray-900"
          class="text-gray-600 hover:text-gray-900 transition"
          >About</a
        >
        <a
          routerLink="/shop"
          routerLinkActive="font-semibold text-gray-900"
          class="text-gray-600 hover:text-gray-900 transition"
          >Shop</a
        >
        <a
          routerLink="/service"
          routerLinkActive="font-semibold text-gray-900"
          class="text-gray-600 hover:text-gray-900 transition"
          >Service</a
        >
      </div>

      <!-- Right actions (desktop) -->
      <div class="hidden md:flex items-center gap-6">
        <a
          (click)="cart.open()"
          class="relative flex items-center gap-2 text-gray-700 hover:text-gray-900 cursor-pointer"
        >
          <!-- ✅ ครอบ icon ด้วย relative -->
          <span class="relative inline-block">
            <!-- Cart icon -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M6 6h15l-1.5 9h-12z" />
              <path d="M6 6l-1-3H3" />
              <circle cx="9" cy="20" r="1.5" />
              <circle cx="18" cy="20" r="1.5" />
            </svg>

            <!-- Badge ตัวเลข -->
            <ng-container *ngIf="cart.totalQty$ | async as n">
              <span
                *ngIf="n > 0"
                class="absolute -top-1 -right-1 flex h-[14px] min-w-[14px] items-center justify-center rounded-full bg-black text-white text-[9px] font-semibold leading-none px-[3px]"
              >
                {{ n }}
              </span>
            </ng-container>
          </span>

          <!-- Label -->
          <span>Cart</span>
        </a>

        <!-- Divider -->
        <span class="h-6 w-px bg-gray-200"></span>

        <a routerLink="/login" class="text-gray-700 hover:text-gray-900"
          >Login</a
        >

        <a
          routerLink="/sign-up"
          class="inline-flex items-center rounded px-4 py-2 text-white bg-black hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-black/30"
        >
          Sign Up
        </a>
      </div>

      <!-- Mobile button -->
      <button
        type="button"
        (click)="mobileOpen = !mobileOpen"
        class="md:hidden inline-flex items-center justify-center rounded p-2 text-gray-700 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-300"
        aria-label="Toggle navigation"
      >
        <svg
          *ngIf="!mobileOpen"
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
        <svg
          *ngIf="mobileOpen"
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile menu -->
  <div class="md:hidden" *ngIf="mobileOpen">
    <div class="space-y-1 px-4 pb-4 pt-2 border-t bg-white">
      <a
        routerLink="/"
        (click)="closeMobile()"
        class="block rounded px-3 py-2 text-gray-700 hover:bg-gray-100"
        >Home</a
      >
      <a
        routerLink="/about"
        (click)="closeMobile()"
        class="block rounded px-3 py-2 text-gray-700 hover:bg-gray-100"
        >About</a
      >
      <a
        routerLink="/shop"
        (click)="closeMobile()"
        class="block rounded px-3 py-2 text-gray-700 hover:bg-gray-100"
        >Shop</a
      >
      <a
        routerLink="/service"
        (click)="closeMobile()"
        class="block rounded px-3 py-2 text-gray-700 hover:bg-gray-100"
        >Service</a
      >

      <div class="my-2 h-px bg-gray-200"></div>

      <a
        routerLink="/cart"
        (click)="closeMobile()"
        class="block rounded px-3 py-2 text-gray-700 hover:bg-gray-100"
        >Cart</a
      >
      <a
        routerLink="/login"
        (click)="closeMobile()"
        class="block rounded px-3 py-2 text-gray-700 hover:bg-gray-100"
        >Login</a
      >
      <a
        routerLink="/signup"
        (click)="closeMobile()"
        class="mt-1 block rounded px-3 py-2 text-center text-white bg-black hover:opacity-90"
        >Sign Up</a
      >
    </div>
  </div>
</nav>
