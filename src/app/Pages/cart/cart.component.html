<section class="bg-white py-12">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <h1 class="text-4xl font-medium mb-10">Your Cart</h1>

    <ng-container *ngIf="items$ | async as items; else emptyCart">
      <div class="grid lg:grid-cols-2 gap-12" *ngIf="items.length > 0">
        <!-- LEFT: Shipping Address -->
        <form class="space-y-6 border p-6 lg:p-8 rounded border-gray-300">
          <h2 class="text-xl font-medium mb-4">Shipping Address</h2>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium mb-2">First name</label>
              <input
                type="text"
                class="w-full rounded border-gray-300 font-light border p-1.5"
                placeholder="Enter your first name"
              />
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Last name</label>
              <input
                type="text"
                class="w-full rounded border-gray-300 font-light border p-1.5"
                placeholder="Enter your last name"
              />
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium mb-2"
                >Email address</label
              >
              <input
                type="email"
                class="w-full rounded border-gray-300 font-light border p-1.5"
                placeholder="Enter your email address"
              />
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Phone number</label>
              <input
                type="tel"
                class="w-full rounded border-gray-300 font-light border p-1.5"
                placeholder="Enter phone number"
              />
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium mb-2">Country</label>
            <select
              class="w-full rounded border-gray-300 font-light border p-1.5"
            >
              <option>Choose your country</option>
              <option value="th">Thailand</option>
              <option value="sg">Singapore</option>
              <option value="jp">Japan</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium mb-2">Address</label>
            <input
              type="text"
              class="w-full rounded border-gray-300 font-light border p-1.5"
              placeholder="Enter your address"
            />
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium mb-2">City</label>
              <input
                type="text"
                class="w-full rounded border-gray-300 font-light border p-1.5"
                placeholder="Enter city"
              />
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Zip Code</label>
              <input
                type="text"
                class="w-full rounded border-gray-300 font-light border p-1.5"
                placeholder="Enter zip/postcode"
              />
            </div>
          </div>
        </form>

        <!-- RIGHT: Order Summary -->
        <div class="border p-6 lg:p-8 rounded border-gray-300">
          <h2 class="text-xl font-semibold mb-6">Order Summary</h2>

          <!-- Header -->
          <div class="flex justify-between text-sm text-gray-500 mb-3">
            <span>Product</span>
            <span>Total</span>
          </div>

          <!-- Product list -->
          <div
            *ngFor="let item of items"
            class="flex items-center justify-between py-3 border-b border-gray-100"
          >
            <div class="flex items-center gap-3">
              <div class="h-14 w-14 rounded bg-gray-100 overflow-hidden">
                <img
                  [src]="item.image"
                  [alt]="item.name"
                  class="h-full w-full object-cover"
                />
              </div>
              <div>
                <p class="font-medium text-gray-900">{{ item.name }}</p>
                <p class="text-sm text-gray-500">x{{ item.qty }}</p>
              </div>
            </div>

            <div class="text-right">
              <p class="font-medium">฿ {{ item.price * item.qty }}</p>
              <button
                (click)="remove(item.id)"
                class="text-xs text-red-500 hover:underline"
              >
                Remove
              </button>
            </div>
          </div>

          <!-- Subtotal -->
          <div class="mt-6 space-y-2 text-sm text-gray-600">
            <div class="flex justify-between">
              <span>SUBTOTAL</span>
              <span>฿ {{ (subtotal$ | async) ?? 0 }}</span>
            </div>
            <div class="flex justify-between">
              <span>SHIPPING</span>
              <span>Free shipping</span>
            </div>
          </div>

          <!-- Total -->
          <div class="mt-4 flex justify-between font-bold text-lg">
            <span>Total</span>
            <span>฿ {{ (subtotal$ | async) ?? 0 }}</span>
          </div>

          <!-- Buttons -->
          <div class="mt-8 space-y-3">
            <button
              type="button"
              (click)="onCheckout()"
              class="w-full bg-black text-white py-3 rounded font-medium hover:opacity-90 transition"
            >
              Proceed to Checkout →
            </button>

            <button
              class="w-full border border-gray-400 text-gray-700 py-3 rounded font-medium hover:bg-gray-100 transition"
              (click)="clear()"
            >
              Clear Cart
            </button>
          </div>
        </div>
      </div>
    </ng-container>

    <!-- ไม่มีสินค้า -->
    <ng-template #emptyCart>
      <p class="text-center text-gray-500 mt-12 text-lg">Your cart is empty.</p>
    </ng-template>
  </div>
</section>
