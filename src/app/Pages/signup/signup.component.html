<div class="bg-[#f5e9e4] py-28 text-center">
  <h2 class="text-lg text-gray-600">Welcome to <span class="font-semibold bg-black text-white">Candlea</span></h2>
  <h1 class="text-4xl md:text-5xl font-medium mt-2 font-serif">About Products</h1>
</div>
<section class="bg-[#f8f5f2] py-16">
  <div class="mx-auto max-w-md bg-[#f6f7ef] p-10 rounded shadow">
    <h2 class="text-2xl font-bold mb-6">Signup</h2>

    <form class="space-y-5">
      <!-- Email -->
      <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
            📧
          </span>
          <input type="email" placeholder="Enter your email"
                 class="w-full pl-10 rounded border-gray-300 focus:ring-black focus:border-black"/>
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium mb-1">Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">🔒</span>
          <input type="password" placeholder="Enter password"
                 class="w-full pl-10 pr-10 rounded border-gray-300 focus:ring-black focus:border-black"/>
          <button type="button" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500">
            👁
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="block text-sm font-medium mb-1">Confirm Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">🔒</span>
          <input type="password" placeholder="Re-enter password"
                 class="w-full pl-10 pr-10 rounded border-gray-300 focus:ring-black focus:border-black"/>
          <button type="button" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500">
            👁
          </button>
        </div>
      </div>

      <!-- Terms -->
      <div class="flex items-center gap-2 text-sm">
        <input type="checkbox" class="rounded border-gray-300"/>
        <span>I agree to platform’s <a href="#" class="text-black underline">Terms of Service</a> 
          and <a href="#" class="text-black underline">Privacy Policy</a></span>
      </div>

      <!-- Submit -->
      <button type="submit"
              class="w-full bg-black text-white py-2 rounded hover:opacity-90">
        Sign Up
      </button>
    </form>
  </div>
</section>
